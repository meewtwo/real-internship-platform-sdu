# One Worker serves the API (/api/*) AND the built frontend (static assets) on the same origin.
name = "sdu-career-match"
main = "src/worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Custom domains (also reachable on sdu-career-match.<subdomain>.workers.dev). Listed here so deploys keep them.
# (Top-level key: it must stay above the first [table] header, or TOML files it under that table.)
routes = [
  { pattern = "sdu.notatrap.dev", custom_domain = true },
  { pattern = "sdu-career.notatrap.dev", custom_domain = true },
]
workers_dev = true # with routes set, wrangler would otherwise switch the workers.dev address off

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Cron Triggers: retry failed instant e-mails every 15 minutes; weekly digest Monday 04:00 UTC (09:00 Almaty)
[triggers]
crons = ["*/15 * * * *", "0 4 * * 1"]

# Cloudflare Email Sending (domain onboarded with `wrangler email sending enable <domain>`; MAIL_FROM must use that domain)
[[send_email]]
name = "EMAIL"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://sdu.notatrap.dev"
MAIL_FROM = "SDU Career Match <no-reply@notatrap.dev>"

# Cloudflare D1 (SQLite). The schema is database/d1/*.sql — the SAME files the local server and the tests use:
#   npx wrangler d1 migrations apply sdu-career-match --remote
[[d1_databases]]
binding = "DB"
database_name = "sdu-career-match"
database_id = "f2570393-e4e2-4c9b-b1a0-a220b1fe9866"
migrations_dir = "../database/d1"

# Secrets (never in this file):
#   npx wrangler secret put APP_SECRET      # 32+ random chars
#   npx wrangler secret put RESEND_API_KEY  # transactional email provider

# ── Optional bindings (uncomment after creating the resources; the app works without them) ──
# R2 for CV files instead of PostgreSQL:   npx wrangler r2 bucket create sdu-cvs
# [[r2_buckets]]
# binding = "CV_BUCKET"
# bucket_name = "sdu-cvs"
#
# Background queue for matching on publish: npx wrangler queues create sdu-jobs
# [[queues.producers]]
# queue = "sdu-jobs"
# binding = "JOBS"
# [[queues.consumers]]
# queue = "sdu-jobs"
# max_batch_size = 10
# max_retries = 3

# Workers AI for semantic matching (multilingual embeddings, no API key needed). Uncomment to enable:
# [ai]
# binding = "AI"
